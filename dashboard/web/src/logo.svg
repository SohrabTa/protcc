<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
<!-- One latent across the encoder layers: slate is depth and amber is activation, as on the page.
     Inline in the header, the depth and signal tokens of the page apply and follow the theme
     switch. As the favicon the SVG is its own document, so `svg:root` matches only there and
     supplies copies of the two tokens from style.css. XML forbids a double hyphen in a comment,
     so the token names stay out of this one. -->
<style>
svg:root { --depth: #4b5e7a; --signal: #c2570c; }
@media (prefers-color-scheme: dark) { svg:root { --depth: #9fb2cd; --signal: #f0954c; } }
</style>
<path d="M3 5H16.8M23.2 5H29M3 10.5H16M24 10.5H29M3 16H15.5M24.5 16H29M3 21.5H16.1M23.9 21.5H29M3 27H16.9M23.1 27H29" fill="none" stroke-width="2.2" stroke-linecap="round" style="stroke: var(--depth)"/>
<g style="fill: var(--signal)">
<circle cx="20" cy="5" r="1.3"/>
<circle cx="20" cy="10.5" r="2.1"/>
<circle cx="20" cy="16" r="2.6"/>
<circle cx="20" cy="21.5" r="2"/>
<circle cx="20" cy="27" r="1.2"/>
</g>
</svg>
