# The dashboard, as static files.
#
# Two rules carry all of it. A route of the single-page app falls back to index.html, and a file
# under /data/ does not. A missing data file has to answer 404: behind a blanket fallback it
# answers 200 with HTML, and the site then reports a parse error instead of a missing file. That
# exact bug cost an afternoon during development.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # A structure is written as .cif.gz and the page decompresses it itself. Serving it with
  # Content-Encoding: gzip would make the browser decompress it first, and the page would then
  # try to decompress plain text. So the gzip files are served as what they are.
  types {
    application/gzip gz;
  }
  include /etc/nginx/mime.types;

  gzip on;
  gzip_types application/json text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  # The data tree is immutable for a release, so it can be cached hard.
  location /data/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800, immutable";
    access_log off;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  # index.html carries the hashed asset names, so it must not be cached.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
